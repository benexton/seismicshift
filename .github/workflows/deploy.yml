name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets walk_sync_and_deploy.yml dispatch a deploy explicitly after its own
  # commit - a push made with the default GITHUB_TOKEN doesn't trigger the
  # push event above (GitHub's anti-loop protection), so without this the
  # `on: push` trigger alone would never fire from that job's commits.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_LFE_SUPABASE_URL: ${{ secrets.PUBLIC_LFE_SUPABASE_URL }}
          PUBLIC_LFE_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_LFE_SUPABASE_ANON_KEY }}
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
          PUBLIC_DIRECTIONS_WORKER_URL: ${{ secrets.PUBLIC_DIRECTIONS_WORKER_URL }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment