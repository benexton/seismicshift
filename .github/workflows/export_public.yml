name: Publish public snapshot

# Publishes a sanitized, read-only snapshot of the verified sites for the public
# viewer (/kumamoto-2026-public). Coordinates are rounded. Run on demand, or on a
# schedule. Only writes the public snapshot file; never edits observation data.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 20 * * *'   # optional daily refresh

concurrency:
  group: export-public
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scripts/requirements-report.txt
      - name: Publish snapshot
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_public.py
