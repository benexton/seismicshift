name: Backup to Google Sheets

# Mirrors Supabase into the backup Google Sheet (two tabs). Runs once a day,
# and can also be run on demand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # daily at 19:00 UTC (about 7am NZST). Change if you like.

concurrency:
  group: export-sheets
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r scripts/requirements-sheets.txt
      - name: Export to Google Sheets
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/export_to_sheets.py
