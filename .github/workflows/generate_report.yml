name: Generate report conclusions

# Drafts AI "Preliminary Conclusions" from the verified sites and stores them in
# event_meta. Run on demand (this is what the owner-only "Regenerate" button
# opens). Read-only on observation data.
on:
  workflow_dispatch:

concurrency:
  group: generate-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r scripts/requirements-report.txt
      - name: Draft conclusions
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/generate_report.py
