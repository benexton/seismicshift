name: LFE - Publish public snapshot

# Publishes a per-event public snapshot (public/<slug>.json) plus the
# events-index.json manifest the /lfe/public/ dropdown reads. Leave
# event_slug blank to rebuild the manifest and every public event; set it to
# refresh just one event's snapshot (the manifest itself is only rebuilt on a
# full run, since a single-event run doesn't know about the others).
on:
  workflow_dispatch:
    inputs:
      event_slug:
        description: 'Event slug (blank = rebuild everything)'
        required: false
        default: ''

concurrency:
  group: lfe-export-public
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r scripts/requirements-report.txt
      - name: Publish snapshot(s)
        env:
          LFE_SUPABASE_URL: ${{ secrets.LFE_SUPABASE_URL }}
          LFE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LFE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/lfe/export_public.py --event-slug "${{ inputs.event_slug }}"
