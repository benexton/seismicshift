name: LFE - Ingest triage data

# Runs the scraper + AI triage pipeline for the LFE platform (separate
# Supabase project from Kumamoto's). Leave event_slug blank to process every
# status='active' event; set it to run just one.
on:
  workflow_dispatch:
    inputs:
      event_slug:
        description: 'Event slug (blank = every active event)'
        required: false
        default: ''

concurrency:
  group: lfe-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ingestion pipeline
        env:
          LFE_SUPABASE_URL: ${{ secrets.LFE_SUPABASE_URL }}
          LFE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LFE_SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}        # 'openai' | 'gemini' | 'mock'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NOMINATIM_UA: ${{ secrets.NOMINATIM_UA }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TWITTER_MAX_RESULTS: ${{ vars.TWITTER_MAX_RESULTS }}  # optional, defaults to 25 in the script
          EVENT_RADIUS_KM: ${{ vars.EVENT_RADIUS_KM }}  # optional, defaults to 500 in the script
        run: python scripts/lfe/ingest_triage_data.py --event-slug "${{ inputs.event_slug }}"
