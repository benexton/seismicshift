<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17638f">
<title>Seismic Walk - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&display=swap">
<style>
  /* Same visual language as the public /walk/ tour (src/components/walk/*)
     - DM Sans, brand blue #17638f, white rounded-3xl cards on a slate-50
     page, slate-900/500/400 text scale - so this admin tool reads as part
     of the same product instead of the dark build-to-thrive admin theme it
     was originally cloned from. */
  :root{
    --brand:#17638f;
    --brand-tint:#eef1f3;
    --ink:#0f172a;
    --body:#64748b;
    --muted:#94a3b8;
    --line:#f1f5f9;
    --line-strong:#e2e8f0;
    --line-stronger:#cbd5e1;
    --danger:#ef4444;
    --danger-tint:#fef2f2;
    --danger-border:#fecaca;
    --safe:#059669;
    --page-bg:#f8fafc;
    --font:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--page-bg);
    color:var(--ink);
    min-height:100dvh;
    padding:32px 16px 64px;
  }
  #app{width:100%;max-width:900px;margin:0 auto;}
  h1{font-size:28px;font-weight:900;letter-spacing:-0.02em;margin:0 0 4px;color:var(--ink);}
  p.sub{color:var(--body);font-size:14px;line-height:1.5;margin:0 0 24px;max-width:60ch;}

  .card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:20px;}

  .gate{max-width:360px;}
  .gate label, .field label{
    display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .gate input, .field input, .field select, .field textarea{
    width:100%;background:#fff;border:2px solid var(--line-strong);border-radius:16px;
    color:var(--ink);font-size:14px;padding:10px 14px;font-family:inherit;margin-bottom:14px;
    transition:border-color .15s ease;
  }
  .gate input:focus-visible, .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible{
    outline:none;border-color:var(--brand);
  }
  .field textarea{resize:vertical;min-height:80px;}

  button{font-family:inherit;}
  .btn{
    display:inline-block;background:var(--brand);color:#fff;border:none;border-radius:999px;
    font-weight:700;font-size:13px;letter-spacing:.02em;padding:11px 20px;
    cursor:pointer;transition:opacity .15s ease;box-shadow:0 2px 8px rgba(23,99,143,.25);
  }
  .btn:hover{opacity:.9;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn-secondary{
    background:#fff;color:var(--body);border:2px solid var(--line-stronger);box-shadow:none;
    padding:9px 18px;
  }
  .btn-secondary:hover{opacity:1;border-color:var(--brand);color:var(--brand);}
  .btn-danger{
    background:var(--danger-tint);color:#b91c1c;border:2px solid var(--danger-border);box-shadow:none;
    padding:9px 18px;
  }
  .btn-danger:hover{opacity:1;background:#fee2e2;}
  .gate button{display:block;width:100%;text-align:center;}
  .err{color:var(--danger);font-size:13px;font-weight:500;margin-top:10px;}

  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .status-msg{font-size:12px;font-weight:700;color:var(--muted);}
  .status-msg.ok{color:var(--safe);}
  .status-msg.error{color:var(--danger);}

  .summary{color:var(--body);font-size:14px;margin:0;}

  .pill-list{display:flex;flex-direction:column;gap:10px;}
  .pill{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;
  }
  .pill.dragging{opacity:.4;}
  .pill-handle{
    cursor:grab;color:var(--muted);font-size:16px;line-height:1;user-select:none;flex:0 0 auto;
  }
  .pill-handle:active{cursor:grabbing;}
  .pill-name{font-weight:700;color:var(--ink);flex:1 1 160px;min-width:0;}
  .pill-updated{color:var(--muted);font-size:12px;white-space:nowrap;flex:0 0 auto;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
    border:1px solid;font-size:11px;font-weight:700;letter-spacing:.02em;
  }
  .badge-interior_public{background:#ecfdf5;color:#047857;border-color:#a7f3d0;}
  .badge-foyer_only{background:#fffbeb;color:#b45309;border-color:#fde68a;}
  .badge-exterior_only{background:#f1f5f9;color:#475569;border-color:#e2e8f0;}
  .badge-by_arrangement{background:#f0f9ff;color:#0369a1;border-color:#bae6fd;}

  .row-edit{
    background:#fff;color:var(--brand);border:2px solid var(--brand);border-radius:999px;
    font-size:11px;padding:6px 14px;cursor:pointer;font-weight:700;
  }
  .row-edit:hover{background:var(--brand-tint);}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:32px 16px;z-index:10;}
  .overlay.hidden{display:none;}
  .panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:660px;box-shadow:0 20px 50px rgba(15,23,42,.18);}
  .panel h2{font-size:20px;font-weight:900;letter-spacing:-0.01em;margin:0 0 18px;color:var(--ink);}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .field-grid .field.full{grid-column:1 / -1;}
  .checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .checkbox-field input{width:auto;margin:0;accent-color:var(--brand);}
  .checkbox-field label{margin:0;font-size:13px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:normal;}
  .panel-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap;}
  .panel-actions-right{display:flex;gap:10px;}
</style>
</head>
<body>
<div id="app">
  <h1>Seismic Walk - Admin</h1>
  <p class="sub">Add, edit, or remove tour buildings. Changes publish to the live site nightly, or immediately via "Publish now".</p>

  <div class="card gate" id="gate">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="off">
    <button type="button" class="btn" id="btn-login">Log in</button>
    <p class="err" id="gate-err" style="display:none;"></p>
  </div>

  <div id="results" style="display:none;">
    <div class="topbar">
      <p class="summary" id="summary"></p>
      <div class="topbar-actions">
        <span class="status-msg" id="order-status"></span>
        <span class="status-msg" id="publish-status"></span>
        <button type="button" class="btn btn-secondary" id="btn-publish">Publish now</button>
        <button type="button" class="btn" id="btn-add">Add new building</button>
      </div>
    </div>
    <div class="pill-list" id="rows"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="panel-title">Add building</h2>
    <p class="err" id="form-err" style="display:none;"></p>
    <form id="building-form">
      <div class="field-grid">
        <div class="field full">
          <label for="f-name">Name *</label>
          <input id="f-name" required>
        </div>
        <div class="field">
          <label for="f-name-mi">Te reo Māori name</label>
          <input id="f-name-mi">
        </div>
        <div class="field">
          <label for="f-access-level">Access level *</label>
          <select id="f-access-level" required>
            <option value="interior_public">Interior open to public</option>
            <option value="foyer_only">Foyer / lobby only</option>
            <option value="exterior_only">Exterior viewing only</option>
            <option value="by_arrangement">By arrangement / limited</option>
          </select>
        </div>
        <div class="field full">
          <label for="f-address">Address *</label>
          <input id="f-address" required>
        </div>
        <div class="field">
          <label for="f-lat">Latitude *</label>
          <input id="f-lat" type="number" step="any" required>
        </div>
        <div class="field">
          <label for="f-lng">Longitude *</label>
          <input id="f-lng" type="number" step="any" required>
        </div>
        <div class="field full">
          <label for="f-access-notes">Access notes</label>
          <input id="f-access-notes">
        </div>
        <div class="field">
          <label for="f-year-built">Year built</label>
          <input id="f-year-built" type="number">
        </div>
        <div class="field">
          <label for="f-year-retrofit">Year retrofit</label>
          <input id="f-year-retrofit" type="number">
        </div>
        <div class="field full">
          <label for="f-structural-tags">Structural tags (comma-separated)</label>
          <input id="f-structural-tags" placeholder="base_isolation, low_damage">
        </div>
        <div class="field full">
          <label for="f-summary">Summary *</label>
          <textarea id="f-summary" required></textarea>
        </div>
        <div class="field full">
          <label for="f-story">Story (longer description)</label>
          <textarea id="f-story"></textarea>
        </div>
        <div class="field">
          <label for="f-engineer">Engineer</label>
          <input id="f-engineer">
        </div>
        <div class="field">
          <label for="f-architect">Architect</label>
          <input id="f-architect">
        </div>
        <div class="field">
          <label for="f-storeys">Storeys</label>
          <input id="f-storeys" type="number">
        </div>
        <div class="field">
          <label for="f-step-free">Step-free approach</label>
          <select id="f-step-free">
            <option value="">Unknown</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
      </div>
      <div class="checkbox-field">
        <input type="checkbox" id="f-featured">
        <label for="f-featured">Featured</label>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;">Delete</button>
        <div class="panel-actions-right">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn" id="btn-save">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = 'https://qrblhtyoslxvoyyafgkl.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyYmxodHlvc2x4dm95eWFmZ2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDYwNDMsImV4cCI6MjEwMDkyMjA0M30.Jk4kGwhE_R5JElqgMxZk-U43nHElaGFaI0L7Ha9a8Sk';
  var FN = {
    list: SUPABASE_URL + '/functions/v1/walk-admin-list',
    save: SUPABASE_URL + '/functions/v1/walk-admin-save',
    del: SUPABASE_URL + '/functions/v1/walk-admin-delete',
    publish: SUPABASE_URL + '/functions/v1/walk-admin-publish'
  };
  // Same access_level -> icon/label mapping as src/components/walk/AccessBadge.jsx,
  // so each pill's badge reads as the same one people see on /walk/.
  var ACCESS_INFO = {
    interior_public: { icon: '●', label: 'Interior open' },
    foyer_only: { icon: '◐', label: 'Foyer only' },
    exterior_only: { icon: '○', label: 'Exterior only' },
    by_arrangement: { icon: '△', label: 'By arrangement' }
  };
  // No Supabase session needed - every function below is deployed with
  // verify_jwt off (see supabase/walk/README.md), so admin_password (sent in
  // each request body, checked server-side) is the only real gate.

  var lastPassword = '';
  var buildings = [];
  var editingId = null; // null = adding new

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function fmt(iso){
    try{ return new Date(iso).toLocaleString(); }catch(e){ return iso || ''; }
  }

  function call(url, body){
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify(body)
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
    });
  }

  // --- Login -----------------------------------------------------------
  function login(pw){
    pw = pw || document.getElementById('pw').value;
    var btn = document.getElementById('btn-login');
    var err = document.getElementById('gate-err');
    err.style.display = 'none';
    if(!pw) return;
    btn.disabled = true; btn.textContent = 'Checking...';
    call(FN.list, { admin_password: pw }).then(function(data){
      lastPassword = pw;
      buildings = data.buildings || [];
      document.getElementById('gate').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      renderTable();
    }).catch(function(e){
      err.textContent = e.message || 'Could not log in.';
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Log in';
    });
  }

  function reload(){
    return call(FN.list, { admin_password: lastPassword }).then(function(data){
      buildings = data.buildings || [];
      renderTable();
    });
  }

  // --- List (drag-to-reorder pills) ---------------------------------------
  function accessBadge(level){
    var info = ACCESS_INFO[level];
    if(!info) return esc(level || '');
    return '<span class="badge badge-'+esc(level)+'"><span aria-hidden="true">'+info.icon+'</span>'+esc(info.label)+'</span>';
  }

  function renderTable(){
    document.getElementById('summary').textContent = buildings.length + ' building' + (buildings.length===1?'':'s') + '. Drag to reorder.';
    var list = document.getElementById('rows');
    list.innerHTML = buildings.map(function(b){
      return '<div class="pill" draggable="true" data-id="'+esc(b.id)+'">'+
        '<span class="pill-handle" aria-hidden="true" title="Drag to reorder">&#8942;&#8942;</span>'+
        '<span class="pill-name">'+esc(b.name)+'</span>'+
        accessBadge(b.access_level)+
        '<span class="pill-updated">'+esc(fmt(b.updated_at))+'</span>'+
        '<button type="button" class="row-edit" data-id="'+esc(b.id)+'">Edit</button>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.row-edit'), function(btn){
      btn.addEventListener('click', function(){ openForm(btn.getAttribute('data-id')); });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.pill'), function(pill){
      pill.addEventListener('dragstart', function(){ pill.classList.add('dragging'); });
      pill.addEventListener('dragend', function(){ pill.classList.remove('dragging'); persistOrder(); });
    });
  }

  function dragAfterElement(list, y){
    var els = Array.prototype.filter.call(list.querySelectorAll('.pill:not(.dragging)'), function(){ return true; });
    var closest = { offset: Number.NEGATIVE_INFINITY, element: null };
    els.forEach(function(child){
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if(offset < 0 && offset > closest.offset) closest = { offset: offset, element: child };
    });
    return closest.element;
  }

  // Reads the pills' current DOM order, renumbers sort_order in steps of 10,
  // and saves only the buildings whose order actually changed.
  function persistOrder(){
    var list = document.getElementById('rows');
    var ids = Array.prototype.map.call(list.querySelectorAll('.pill'), function(p){ return p.getAttribute('data-id'); });
    var changes = [];
    ids.forEach(function(id, i){
      var newOrder = (i + 1) * 10;
      var b = buildings.filter(function(x){ return x.id === id; })[0];
      if(b && b.sort_order !== newOrder) changes.push({ id: id, sort_order: newOrder });
    });
    if(!changes.length) return;
    var status = document.getElementById('order-status');
    status.className = 'status-msg'; status.textContent = 'Saving order...';
    Promise.all(changes.map(function(c){
      return call(FN.save, { admin_password: lastPassword, building: { id: c.id, sort_order: c.sort_order } });
    })).then(function(){
      return reload();
    }).then(function(){
      status.className = 'status-msg ok'; status.textContent = 'Order saved.';
    }).catch(function(e){
      status.className = 'status-msg error';
      status.textContent = e.message || 'Could not save order.';
      reload();
    });
  }

  // --- Form ----------------------------------------------------------------
  var F = {}; // field id -> element, populated on first use
  function field(id){
    if(!F[id]) F[id] = document.getElementById(id);
    return F[id];
  }

  function openForm(id){
    editingId = id || null;
    var b = id ? buildings.filter(function(x){ return x.id === id; })[0] : null;
    document.getElementById('form-err').style.display = 'none';
    document.getElementById('panel-title').textContent = b ? 'Edit building' : 'Add building';
    document.getElementById('btn-delete').style.display = b ? 'inline-block' : 'none';

    field('f-name').value = b ? (b.name || '') : '';
    field('f-name-mi').value = b ? (b.name_mi || '') : '';
    field('f-access-level').value = b ? (b.access_level || 'interior_public') : 'interior_public';
    field('f-address').value = b ? (b.address || '') : '';
    field('f-lat').value = b && b.lat != null ? b.lat : '';
    field('f-lng').value = b && b.lng != null ? b.lng : '';
    field('f-access-notes').value = b ? (b.access_notes || '') : '';
    field('f-year-built').value = b && b.year_built != null ? b.year_built : '';
    field('f-year-retrofit').value = b && b.year_retrofit != null ? b.year_retrofit : '';
    field('f-structural-tags').value = b && Array.isArray(b.structural_tags) ? b.structural_tags.join(', ') : '';
    field('f-summary').value = b ? (b.summary || '') : '';
    field('f-story').value = b ? (b.story || '') : '';
    field('f-engineer').value = b ? (b.engineer || '') : '';
    field('f-architect').value = b ? (b.architect || '') : '';
    field('f-storeys').value = b && b.storeys != null ? b.storeys : '';
    field('f-step-free').value = b && b.step_free === true ? 'true' : (b && b.step_free === false ? 'false' : '');
    field('f-featured').checked = !!(b && b.featured);

    document.getElementById('overlay').classList.remove('hidden');
  }

  function closeForm(){
    document.getElementById('overlay').classList.add('hidden');
    editingId = null;
  }

  function collectForm(){
    var stepFreeRaw = field('f-step-free').value;
    var tagsRaw = field('f-structural-tags').value;
    var b = {
      name: field('f-name').value.trim(),
      name_mi: field('f-name-mi').value.trim(),
      access_level: field('f-access-level').value,
      address: field('f-address').value.trim(),
      lat: field('f-lat').value === '' ? null : Number(field('f-lat').value),
      lng: field('f-lng').value === '' ? null : Number(field('f-lng').value),
      access_notes: field('f-access-notes').value.trim(),
      year_built: field('f-year-built').value === '' ? null : Number(field('f-year-built').value),
      year_retrofit: field('f-year-retrofit').value === '' ? null : Number(field('f-year-retrofit').value),
      structural_tags: tagsRaw.split(/[,;]/).map(function(t){ return t.trim(); }).filter(Boolean),
      summary: field('f-summary').value.trim(),
      story: field('f-story').value.trim(),
      engineer: field('f-engineer').value.trim(),
      architect: field('f-architect').value.trim(),
      storeys: field('f-storeys').value === '' ? null : Number(field('f-storeys').value),
      step_free: stepFreeRaw === '' ? null : stepFreeRaw === 'true',
      featured: field('f-featured').checked
    };
    if(editingId) b.id = editingId;
    return b;
  }

  function saveBuilding(ev){
    ev.preventDefault();
    var err = document.getElementById('form-err');
    err.style.display = 'none';
    var btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Saving...';
    call(FN.save, { admin_password: lastPassword, building: collectForm() }).then(function(){
      return reload();
    }).then(function(){
      closeForm();
    }).catch(function(e){
      err.textContent = e.message || 'Could not save building.';
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Save';
    });
  }

  function deleteBuilding(){
    if(!editingId) return;
    var b = buildings.filter(function(x){ return x.id === editingId; })[0];
    var name = b ? b.name : editingId;
    if(!window.confirm('Delete "' + name + '"? This cannot be undone.')) return;
    var btn = document.getElementById('btn-delete');
    var err = document.getElementById('form-err');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Deleting...';
    call(FN.del, { admin_password: lastPassword, id: editingId }).then(function(){
      return reload();
    }).then(function(){
      closeForm();
    }).catch(function(e){
      err.textContent = e.message || 'Could not delete building.';
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Delete';
    });
  }

  // --- Publish -------------------------------------------------------------
  function publish(){
    var btn = document.getElementById('btn-publish');
    var status = document.getElementById('publish-status');
    status.className = 'status-msg'; status.textContent = '';
    btn.disabled = true; btn.textContent = 'Publishing...';
    call(FN.publish, { admin_password: lastPassword }).then(function(){
      status.className = 'status-msg ok';
      status.textContent = 'Publishing - takes a minute or two. Edits also auto-publish nightly regardless.';
    }).catch(function(e){
      status.className = 'status-msg error';
      status.textContent = e.message || 'Could not start publish.';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Publish now';
    });
  }

  document.getElementById('rows').addEventListener('dragover', function(e){
    e.preventDefault();
    var dragging = document.querySelector('.pill.dragging');
    if(!dragging) return;
    var list = document.getElementById('rows');
    var after = dragAfterElement(list, e.clientY);
    if(after == null) list.appendChild(dragging);
    else list.insertBefore(dragging, after);
  });
  document.getElementById('btn-login').addEventListener('click', function(){ login(); });
  document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
  document.getElementById('btn-publish').addEventListener('click', publish);
  document.getElementById('btn-add').addEventListener('click', function(){ openForm(null); });
  document.getElementById('btn-cancel').addEventListener('click', closeForm);
  document.getElementById('btn-delete').addEventListener('click', deleteBuilding);
  document.getElementById('building-form').addEventListener('submit', saveBuilding);
  document.getElementById('overlay').addEventListener('click', function(e){
    if(e.target.id === 'overlay') closeForm();
  });
})();
</script>
</body>
</html>
