<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#081c29">
<title>Seismic Walk - Admin</title>
<style>
  :root{
    --bg-deep:#081c29;
    --bg-panel:#0f3049;
    --bg-panel-2:#123a52;
    --line-dim:rgba(191,224,236,.38);
    --line-faint:rgba(191,224,236,.14);
    --paper:#eef4f6;
    --line:#bfe0ec;
    --amber:#e8a33d;
    --danger:#e0574f;
    --safe:#38b07d;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg-deep);
    color:var(--paper);
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  #app{width:100%;max-width:900px;}
  h1{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;}
  p.sub{color:var(--line-dim);font-size:13px;margin:0 0 20px;}

  .gate{
    background:var(--bg-panel);border:1px solid var(--line-faint);border-radius:4px;
    padding:20px;max-width:340px;
  }
  .gate label, .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--line-dim);margin-bottom:6px;}
  .gate input, .field input, .field select, .field textarea{
    width:100%;background:var(--bg-panel-2);border:1px solid var(--line-dim);border-radius:3px;
    color:var(--paper);font-size:14px;padding:10px 12px;font-family:inherit;margin-bottom:12px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .gate input:focus-visible, .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  button{font-family:inherit;}
  .btn{
    display:inline-block;background:var(--amber);color:#231403;border:none;border-radius:3px;
    font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;padding:10px 16px;
    cursor:pointer;
  }
  .btn:disabled{filter:grayscale(.5) brightness(.75);cursor:not-allowed;}
  .btn-secondary{background:transparent;color:var(--line);border:1px solid var(--line-dim);}
  .btn-danger{background:var(--danger);color:#2a0906;}
  .gate button{display:block;width:100%;}
  .gate .err{color:var(--danger);font-size:12px;margin-top:10px;}

  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .status-msg{font-size:12px;color:var(--line-dim);}
  .status-msg.ok{color:var(--safe);}
  .status-msg.error{color:var(--danger);}

  .summary{color:var(--line-dim);font-size:13px;margin-bottom:14px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line-faint);border-radius:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-faint);white-space:nowrap;}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--line-dim);background:var(--bg-panel);}
  td{color:var(--paper);}
  td.id{color:var(--line-dim);font-family:var(--mono);font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .row-edit{background:transparent;color:var(--amber);border:1px solid var(--amber);border-radius:3px;font-size:11px;padding:5px 10px;cursor:pointer;text-transform:uppercase;font-weight:700;}

  .overlay{position:fixed;inset:0;background:rgba(4,12,18,.7);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:32px 16px;z-index:10;}
  .overlay.hidden{display:none;}
  .panel{background:var(--bg-panel);border:1px solid var(--line-faint);border-radius:4px;padding:24px;width:100%;max-width:640px;}
  .panel h2{font-size:16px;font-weight:800;text-transform:uppercase;margin:0 0 4px;}
  .panel .id-note{color:var(--line-dim);font-size:12px;margin:0 0 18px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .field-grid .field.full{grid-column:1 / -1;}
  .checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .checkbox-field input{width:auto;margin:0;}
  .checkbox-field label{margin:0;}
  .panel-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap;}
  .panel-actions-right{display:flex;gap:10px;}
  .panel .err{color:var(--danger);font-size:12px;margin:0 0 12px;}
</style>
</head>
<body>
<div id="app">
  <h1>Seismic Walk - Admin</h1>
  <p class="sub">Add, edit, or remove tour buildings. Changes publish to the live site nightly, or immediately via "Publish now".</p>

  <div class="gate" id="gate">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="off">
    <button type="button" class="btn" id="btn-login">Log in</button>
    <p class="err" id="gate-err" style="display:none;"></p>
  </div>

  <div id="results" style="display:none;">
    <div class="topbar">
      <p class="summary" id="summary" style="margin:0;"></p>
      <div class="topbar-actions">
        <span class="status-msg" id="publish-status"></span>
        <button type="button" class="btn btn-secondary" id="btn-publish">Publish now</button>
        <button type="button" class="btn" id="btn-add">Add new building</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Access</th><th>Id</th><th>Updated</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="panel-title">Add building</h2>
    <p class="id-note" id="panel-id-note"></p>
    <p class="err" id="form-err" style="display:none;"></p>
    <form id="building-form">
      <div class="field-grid">
        <div class="field full">
          <label for="f-name">Name *</label>
          <input id="f-name" required>
        </div>
        <div class="field">
          <label for="f-name-mi">Te reo Maori name</label>
          <input id="f-name-mi">
        </div>
        <div class="field">
          <label for="f-access-level">Access level *</label>
          <select id="f-access-level" required>
            <option value="interior_public">Interior open to public</option>
            <option value="foyer_only">Foyer / lobby only</option>
            <option value="exterior_only">Exterior viewing only</option>
            <option value="by_arrangement">By arrangement / limited</option>
          </select>
        </div>
        <div class="field full">
          <label for="f-address">Address *</label>
          <input id="f-address" required>
        </div>
        <div class="field">
          <label for="f-lat">Latitude *</label>
          <input id="f-lat" type="number" step="any" required>
        </div>
        <div class="field">
          <label for="f-lng">Longitude *</label>
          <input id="f-lng" type="number" step="any" required>
        </div>
        <div class="field full">
          <label for="f-access-notes">Access notes</label>
          <input id="f-access-notes">
        </div>
        <div class="field">
          <label for="f-year-built">Year built</label>
          <input id="f-year-built" type="number">
        </div>
        <div class="field">
          <label for="f-year-retrofit">Year retrofit</label>
          <input id="f-year-retrofit" type="number">
        </div>
        <div class="field full">
          <label for="f-structural-tags">Structural tags (comma-separated)</label>
          <input id="f-structural-tags" placeholder="base_isolation, low_damage">
        </div>
        <div class="field full">
          <label for="f-summary">Summary *</label>
          <textarea id="f-summary" required></textarea>
        </div>
        <div class="field full">
          <label for="f-story">Story (longer description)</label>
          <textarea id="f-story"></textarea>
        </div>
        <div class="field">
          <label for="f-engineer">Engineer</label>
          <input id="f-engineer">
        </div>
        <div class="field">
          <label for="f-architect">Architect</label>
          <input id="f-architect">
        </div>
        <div class="field">
          <label for="f-storeys">Storeys</label>
          <input id="f-storeys" type="number">
        </div>
        <div class="field">
          <label for="f-step-free">Step-free approach</label>
          <select id="f-step-free">
            <option value="">Unknown</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="field full">
          <label for="f-image">Image (path or URL)</label>
          <input id="f-image" placeholder="/images/walk/example.svg">
        </div>
        <div class="field">
          <label for="f-image-credit">Image credit</label>
          <input id="f-image-credit">
        </div>
        <div class="field">
          <label for="f-external-url">External URL</label>
          <input id="f-external-url">
        </div>
        <div class="field">
          <label for="f-category">Category</label>
          <input id="f-category" placeholder="heritage, civic, new_build...">
        </div>
        <div class="field">
          <label for="f-sort-order">Display order</label>
          <input id="f-sort-order" type="number">
        </div>
      </div>
      <div class="checkbox-field">
        <input type="checkbox" id="f-featured">
        <label for="f-featured">Featured</label>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;">Delete</button>
        <div class="panel-actions-right">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn" id="btn-save">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = 'https://qrblhtyoslxvoyyafgkl.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyYmxodHlvc2x4dm95eWFmZ2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDYwNDMsImV4cCI6MjEwMDkyMjA0M30.Jk4kGwhE_R5JElqgMxZk-U43nHElaGFaI0L7Ha9a8Sk';
  var FN = {
    list: SUPABASE_URL + '/functions/v1/walk-admin-list',
    save: SUPABASE_URL + '/functions/v1/walk-admin-save',
    del: SUPABASE_URL + '/functions/v1/walk-admin-delete',
    publish: SUPABASE_URL + '/functions/v1/walk-admin-publish'
  };
  var ACCESS_LABELS = {
    interior_public: 'Interior open',
    foyer_only: 'Foyer only',
    exterior_only: 'Exterior only',
    by_arrangement: 'By arrangement'
  };
  // No Supabase session needed - every function below is deployed with
  // verify_jwt off (see supabase/walk/README.md), so admin_password (sent in
  // each request body, checked server-side) is the only real gate.

  var lastPassword = '';
  var buildings = [];
  var editingId = null; // null = adding new

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function fmt(iso){
    try{ return new Date(iso).toLocaleString(); }catch(e){ return iso || ''; }
  }

  function call(url, body){
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify(body)
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
    });
  }

  // --- Login -----------------------------------------------------------
  function login(pw){
    pw = pw || document.getElementById('pw').value;
    var btn = document.getElementById('btn-login');
    var err = document.getElementById('gate-err');
    err.style.display = 'none';
    if(!pw) return;
    btn.disabled = true; btn.textContent = 'Checking...';
    call(FN.list, { admin_password: pw }).then(function(data){
      lastPassword = pw;
      buildings = data.buildings || [];
      document.getElementById('gate').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      renderTable();
    }).catch(function(e){
      err.textContent = e.message || 'Could not log in.';
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Log in';
    });
  }

  function reload(){
    return call(FN.list, { admin_password: lastPassword }).then(function(data){
      buildings = data.buildings || [];
      renderTable();
    });
  }

  // --- Table -------------------------------------------------------------
  function renderTable(){
    document.getElementById('summary').textContent = buildings.length + ' building' + (buildings.length===1?'':'s') + '.';
    document.getElementById('rows').innerHTML = buildings.map(function(b){
      return '<tr>'+
        '<td>'+esc(b.name)+'</td>'+
        '<td>'+esc(ACCESS_LABELS[b.access_level] || b.access_level)+'</td>'+
        '<td class="id">'+esc(b.id)+'</td>'+
        '<td>'+esc(fmt(b.updated_at))+'</td>'+
        '<td><button type="button" class="row-edit" data-id="'+esc(b.id)+'">Edit</button></td>'+
      '</tr>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.row-edit'), function(btn){
      btn.addEventListener('click', function(){ openForm(btn.getAttribute('data-id')); });
    });
  }

  // --- Form ----------------------------------------------------------------
  var F = {}; // field id -> element, populated on first use
  function field(id){
    if(!F[id]) F[id] = document.getElementById(id);
    return F[id];
  }

  function openForm(id){
    editingId = id || null;
    var b = id ? buildings.filter(function(x){ return x.id === id; })[0] : null;
    document.getElementById('form-err').style.display = 'none';
    document.getElementById('panel-title').textContent = b ? 'Edit building' : 'Add building';
    document.getElementById('panel-id-note').textContent = b ? ('id: ' + b.id + ' (fixed - used in shared tour links)') : 'An id will be generated from the name.';
    document.getElementById('btn-delete').style.display = b ? 'inline-block' : 'none';

    field('f-name').value = b ? (b.name || '') : '';
    field('f-name-mi').value = b ? (b.name_mi || '') : '';
    field('f-access-level').value = b ? (b.access_level || 'interior_public') : 'interior_public';
    field('f-address').value = b ? (b.address || '') : '';
    field('f-lat').value = b && b.lat != null ? b.lat : '';
    field('f-lng').value = b && b.lng != null ? b.lng : '';
    field('f-access-notes').value = b ? (b.access_notes || '') : '';
    field('f-year-built').value = b && b.year_built != null ? b.year_built : '';
    field('f-year-retrofit').value = b && b.year_retrofit != null ? b.year_retrofit : '';
    field('f-structural-tags').value = b && Array.isArray(b.structural_tags) ? b.structural_tags.join(', ') : '';
    field('f-summary').value = b ? (b.summary || '') : '';
    field('f-story').value = b ? (b.story || '') : '';
    field('f-engineer').value = b ? (b.engineer || '') : '';
    field('f-architect').value = b ? (b.architect || '') : '';
    field('f-storeys').value = b && b.storeys != null ? b.storeys : '';
    field('f-step-free').value = b && b.step_free === true ? 'true' : (b && b.step_free === false ? 'false' : '');
    field('f-image').value = b ? (b.image || '') : '';
    field('f-image-credit').value = b ? (b.image_credit || '') : '';
    field('f-external-url').value = b ? (b.external_url || '') : '';
    field('f-category').value = b ? (b.category || '') : '';
    field('f-sort-order').value = b && b.sort_order != null ? b.sort_order : '';
    field('f-featured').checked = !!(b && b.featured);

    document.getElementById('overlay').classList.remove('hidden');
  }

  function closeForm(){
    document.getElementById('overlay').classList.add('hidden');
    editingId = null;
  }

  function collectForm(){
    var stepFreeRaw = field('f-step-free').value;
    var tagsRaw = field('f-structural-tags').value;
    var b = {
      name: field('f-name').value.trim(),
      name_mi: field('f-name-mi').value.trim(),
      access_level: field('f-access-level').value,
      address: field('f-address').value.trim(),
      lat: field('f-lat').value === '' ? null : Number(field('f-lat').value),
      lng: field('f-lng').value === '' ? null : Number(field('f-lng').value),
      access_notes: field('f-access-notes').value.trim(),
      year_built: field('f-year-built').value === '' ? null : Number(field('f-year-built').value),
      year_retrofit: field('f-year-retrofit').value === '' ? null : Number(field('f-year-retrofit').value),
      structural_tags: tagsRaw.split(/[,;]/).map(function(t){ return t.trim(); }).filter(Boolean),
      summary: field('f-summary').value.trim(),
      story: field('f-story').value.trim(),
      engineer: field('f-engineer').value.trim(),
      architect: field('f-architect').value.trim(),
      storeys: field('f-storeys').value === '' ? null : Number(field('f-storeys').value),
      step_free: stepFreeRaw === '' ? null : stepFreeRaw === 'true',
      image: field('f-image').value.trim(),
      image_credit: field('f-image-credit').value.trim(),
      external_url: field('f-external-url').value.trim(),
      category: field('f-category').value.trim(),
      sort_order: field('f-sort-order').value === '' ? null : Number(field('f-sort-order').value),
      featured: field('f-featured').checked
    };
    if(editingId) b.id = editingId;
    return b;
  }

  function saveBuilding(ev){
    ev.preventDefault();
    var err = document.getElementById('form-err');
    err.style.display = 'none';
    var btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Saving...';
    call(FN.save, { admin_password: lastPassword, building: collectForm() }).then(function(){
      return reload();
    }).then(function(){
      closeForm();
    }).catch(function(e){
      err.textContent = e.message || 'Could not save building.';
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Save';
    });
  }

  function deleteBuilding(){
    if(!editingId) return;
    var b = buildings.filter(function(x){ return x.id === editingId; })[0];
    var name = b ? b.name : editingId;
    if(!window.confirm('Delete "' + name + '"? This cannot be undone.')) return;
    var btn = document.getElementById('btn-delete');
    var err = document.getElementById('form-err');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Deleting...';
    call(FN.del, { admin_password: lastPassword, id: editingId }).then(function(){
      return reload();
    }).then(function(){
      closeForm();
    }).catch(function(e){
      err.textContent = e.message || 'Could not delete building.';
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Delete';
    });
  }

  // --- Publish -------------------------------------------------------------
  function publish(){
    var btn = document.getElementById('btn-publish');
    var status = document.getElementById('publish-status');
    status.className = 'status-msg'; status.textContent = '';
    btn.disabled = true; btn.textContent = 'Publishing...';
    call(FN.publish, { admin_password: lastPassword }).then(function(){
      status.className = 'status-msg ok';
      status.textContent = 'Publishing - takes a minute or two. Edits also auto-publish nightly regardless.';
    }).catch(function(e){
      status.className = 'status-msg error';
      status.textContent = e.message || 'Could not start publish.';
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Publish now';
    });
  }

  document.getElementById('btn-login').addEventListener('click', function(){ login(); });
  document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
  document.getElementById('btn-publish').addEventListener('click', publish);
  document.getElementById('btn-add').addEventListener('click', function(){ openForm(null); });
  document.getElementById('btn-cancel').addEventListener('click', closeForm);
  document.getElementById('btn-delete').addEventListener('click', deleteBuilding);
  document.getElementById('building-form').addEventListener('submit', saveBuilding);
  document.getElementById('overlay').addEventListener('click', function(e){
    if(e.target.id === 'overlay') closeForm();
  });
})();
</script>
</body>
</html>
